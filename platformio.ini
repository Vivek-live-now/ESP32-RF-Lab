[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:esp32s2]
board = esp32-s2-saola-1

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
build_src_filter = -<*> +<MeasurementEngine.cpp>

